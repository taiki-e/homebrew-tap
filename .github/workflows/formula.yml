name: Formula

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  formula:
    uses: taiki-e/github-actions/.github/workflows/gen.yml@64535e607ea2bc43571fe978adaf5dbe191a1926 # 2026.11.26
    permissions:
      contents: write # for creating branch for pr
      pull-requests: read # for gh pr list
    secrets:
      PR_TOKEN_APP_PRIVATE_KEY: ${{ secrets.PR_TOKEN_APP_PRIVATE_KEY }}
    with:
      script: tools/formula.sh
      commit-script: tools/ci/formula.sh
      title: Update formula
      branch: update-formula
